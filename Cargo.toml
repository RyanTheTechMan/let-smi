[workspace]
members = ["crates/gpu-core", "crates/gpu-napi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ryanthetechman/let-smi"
rust-version = "1.88"

[workspace.dependencies]
blake3 = { version = "=1.8.6", features = ["pure"] }
libloading = "=0.8.9"
napi = { version = "=3.12.1", default-features = false, features = ["napi8", "async", "serde-json", "dyn-symbols"] }
napi-derive = "=3.6.3"
napi-build = "=2.4.1"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
