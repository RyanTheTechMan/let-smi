name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and local native smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm check

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Build native addon locally
        run: pnpm native:build:debug

      - name: Validate local native artifact
        run: pnpm native:validate-artifact x86_64-unknown-linux-gnu

      - name: Build public JavaScript package
        run: pnpm build

      - name: Test public native loader
        run: pnpm native:test-loader

  native:
    name: Cross-platform native artifacts
    needs: quality
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read
