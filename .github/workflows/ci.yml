name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and local native smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm check

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Build native addon locally
        run: pnpm native:build:debug

      - name: Validate local native artifact
        run: pnpm native:validate-artifact x86_64-unknown-linux-gnu

      - name: Build public JavaScript package
        run: pnpm build

      - name: Test public native loader
        run: pnpm native:test-loader

  native:
    name: Cross-platform native artifacts
    needs: quality
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read
