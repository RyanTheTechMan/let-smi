name: Remove orphan npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Unpublish two orphan packages
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install pinned npm client
        run: npm install --global npm@11.19.0

      - name: Verify and remove orphan packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          for package in \
            let-smi-darwin-arm64@0.1.0 \
            let-smi-darwin-x64@0.1.0
          do
            test "$(npm view "$package" version)" = "0.1.0"
            npm unpublish "$package" --force
          done
