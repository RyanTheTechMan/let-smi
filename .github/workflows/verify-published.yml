name: Verify published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published let-smi version to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify npm package / ${{ matrix.settings.name }}
    runs-on: ${{ matrix.settings.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: macOS arm64
            os: macos-15
            node-arch: arm64
            musl: false
          - name: macOS x64
            os: macos-15-intel
            node-arch: x64
            musl: false
          - name: Windows x64
            os: windows-2022
            node-arch: x64
            musl: false
          - name: Linux arm64 glibc
            os: ubuntu-24.04-arm
            node-arch: arm64
            musl: false
          - name: Linux x64 glibc
            os: ubuntu-22.04
            node-arch: x64
            musl: false
          - name: Linux x64 musl
            os: ubuntu-22.04
            node-arch: x64
            musl: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        if: ${{ !matrix.settings.musl }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          architecture: ${{ matrix.settings.node-arch }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify package from npm
        if: ${{ !matrix.settings.musl }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/test-published-package.mjs "$RELEASE_VERSION"

      - name: Verify package from npm on musl
        if: matrix.settings.musl
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WORKSPACE: ${{ github.workspace }}
        run: >-
          docker run --rm
          --volume "$WORKSPACE:/workspace:ro"
          --workdir /workspace
          --env RELEASE_VERSION
          node:22.23.2-alpine@sha256:76789712cd1ae89a1225eac9077010d68987a423588042dac30446f502f1858c
          node scripts/test-published-package.mjs
