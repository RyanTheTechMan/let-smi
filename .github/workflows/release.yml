name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm check

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Verify release version
        run: node scripts/release-version.mjs "${{ github.ref_name }}"

  native:
    name: Build release artifacts
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  publish:
    name: Publish npm packages
    needs: [quality, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build public JavaScript package
        run: pnpm build

      - name: Create platform package directories
        run: pnpm native:create-npm

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble platform packages
        run: pnpm native:artifacts

      - name: Validate assembled artifacts
        shell: bash
        run: |
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-pc-windows-msvc \
            x86_64-pc-windows-msvc \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl
          do
            pnpm native:validate-artifact "$target"
          done

      - name: Validate prepublish plan
        run: pnpm native:prepublish:dry

      - name: Resolve npm distribution tag
        id: version
        run: node scripts/release-version.mjs "${{ github.ref_name }}"

      - name: Publish root and platform packages with OIDC
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_TAG: ${{ steps.version.outputs.npm-tag }}
        run: npm publish ./packages/gpu --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "${{ github.ref_name }}"
          --verify-tag
          --generate-notes
