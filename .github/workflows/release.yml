name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm check

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

  native:
    name: Build release artifacts
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  publish:
    name: Publish npm packages
    needs: [quality, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # Authenticate npm trusted publishing without a token.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install pinned npm publishing client
        run: npm install --global npm@11.19.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build public JavaScript package
        run: pnpm build

      - name: Create platform package directories
        run: pnpm native:create-npm

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Assemble platform packages
        run: pnpm native:artifacts

      - name: Validate assembled artifacts
        shell: bash
        run: |
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl
          do
            pnpm native:validate-artifact "$target"
          done

      - name: Validate publishable package contents
        shell: bash
        run: |
          for package_dir in \
            packages/gpu/npm/darwin-arm64 \
            packages/gpu/npm/darwin-x64 \
            packages/gpu/npm/win32-x64-msvc \
            packages/gpu/npm/linux-arm64-gnu \
            packages/gpu/npm/linux-x64-gnu \
            packages/gpu/npm/linux-x64-musl
          do
            npm pack "$package_dir" --dry-run --json --ignore-scripts >/dev/null
          done

          npm pack ./packages/gpu --dry-run --json --ignore-scripts >/dev/null

      - name: Resolve npm distribution tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

      - name: Publish root and platform packages
        env:
          # This secret is required only to create the packages in the initial
          # release. Once npm trusted publishing is configured, OIDC is used
          # and the deleted secret expands to an empty value.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_TAG: ${{ steps.version.outputs.npm-tag }}
        shell: bash
        run: |
          for package_dir in \
            packages/gpu/npm/darwin-arm64 \
            packages/gpu/npm/darwin-x64 \
            packages/gpu/npm/win32-x64-msvc \
            packages/gpu/npm/linux-arm64-gnu \
            packages/gpu/npm/linux-x64-gnu \
            packages/gpu/npm/linux-x64-musl
          do
            npm publish "$package_dir" --access public --ignore-scripts
          done

          npm publish ./packages/gpu --access public --ignore-scripts

  verify:
    name: Verify published package / ${{ matrix.settings.name }}
    needs: publish
    runs-on: ${{ matrix.settings.os }}
    # npm scans every newly published package before it becomes installable.
    # The root and native optional packages may clear that scan at different times.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: macOS arm64
            os: macos-15
            node-arch: arm64
            musl: false
          - name: macOS x64
            os: macos-15-intel
            node-arch: x64
            musl: false
          - name: Windows x64
            os: windows-2022
            node-arch: x64
            musl: false
          - name: Linux arm64 glibc
            os: ubuntu-24.04-arm
            node-arch: arm64
            musl: false
          - name: Linux x64 glibc
            os: ubuntu-22.04
            node-arch: x64
            musl: false
          - name: Linux x64 musl
            os: ubuntu-22.04
            node-arch: x64
            musl: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        if: ${{ !matrix.settings.musl }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          architecture: ${{ matrix.settings.node-arch }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify package from npm
        if: ${{ !matrix.settings.musl }}
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/test-published-package.mjs "${RELEASE_TAG#v}"

      - name: Verify package from npm on musl
        if: matrix.settings.musl
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WORKSPACE: ${{ github.workspace }}
        run: >-
          docker run --rm
          --volume "$WORKSPACE:/workspace:ro"
          --workdir /workspace
          --env RELEASE_VERSION="${RELEASE_TAG#v}"
          node:22.23.2-alpine@sha256:76789712cd1ae89a1225eac9077010d68987a423588042dac30446f502f1858c
          node scripts/test-published-package.mjs

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --generate-notes
