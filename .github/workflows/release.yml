name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm check

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

  native:
    name: Build release artifacts
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  publish:
    name: Publish npm packages
    needs: [quality, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write # Create the matching GitHub release after publish.
      id-token: write # Authenticate npm trusted publishing without a token.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build public JavaScript package
        run: pnpm build

      - name: Create platform package directories
        run: pnpm native:create-npm

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Assemble platform packages
        run: pnpm native:artifacts

      - name: Validate assembled artifacts
        shell: bash
        run: |
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl
          do
            pnpm native:validate-artifact "$target"
          done

      - name: Validate prepublish plan
        run: pnpm native:prepublish:dry

      - name: Resolve npm distribution tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

      - name: Publish root and platform packages with OIDC
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_TAG: ${{ steps.version.outputs.npm-tag }}
        run: npm publish ./packages/gpu --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --generate-notes
